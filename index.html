<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>mcpack generator</title>
<style>
/*
! tailwindcss v3.4.1 | MIT License | https://tailwindcss.com
*/
*,:after,:before{border:0 solid #e5e7eb;--tw-content:"";-webkit-tap-highlight-color:transparent;-webkit-tap-highlight-color:#00000000;box-sizing:border-box}
:host,html{-webkit-text-size-adjust:100%;font-feature-settings:normal;-webkit-tap-highlight-color:transparent;font-family:ui-sans-serif,system-ui,sans-serif,Apple Color Emoji,Segoe UI Emoji,Segoe UI Symbol,Noto Color Emoji;font-variation-settings:normal;line-height:1.5;tab-size:4}
body{line-height:inherit;margin:0;--tw-text-opacity:1;background-color:#272727;color:rgb(255 255 255/var(--tw-text-opacity));font-family:Minecraftia,unifont;user-select:none;-webkit-user-select:none;width:100%; overflow-x: hidden;}
hr{border-top-width:1px;color:inherit;height:0}
h1,h2,h3,h4,h5,h6{font-size:inherit;font-weight:inherit}
table{border-collapse:collapse;border-color:inherit;text-indent:0}
button,input,optgroup,select,textarea{font-feature-settings:inherit;color:inherit;font-family:inherit;font-size:100%;font-variation-settings:inherit;font-weight:inherit;line-height:inherit;margin:0;padding:0}
button,select{text-transform:none}
[type=button],[type=reset],[type=submit],button{-webkit-appearance:button;background-color:initial;background-image:none}
::-webkit-inner-spin-button,::-webkit-outer-spin-button{height:auto}
blockquote,dd,dl,figure,h1,h2,h3,h4,h5,h6,hr,p,pre{margin:0}
fieldset{margin:0}
fieldset,legend{padding:0}
menu,ol,ul{list-style:none;margin:0;padding:0}
textarea{resize:vertical}
input::placeholder,textarea::placeholder{color:#9ca3af;opacity:1}
[role=button],button{cursor:pointer}
*,:after,:before{--tw-translate-x:0;--tw-translate-y:0;--tw-rotate:0;--tw-skew-x:0;--tw-skew-y:0;--tw-scale-x:1;--tw-scale-y:1;}
.container{margin-left:auto;margin-right:auto;padding-left:1.5rem;padding-right:1.5rem;width:100%; max-width: 800px;}
.children-spacing{display:flex;flex-direction:column;gap:1rem;width:100%}

/* Custom GitHub Fonts */
@font-face{font-display:block;font-family:unifont;src:url('https://raw.githubusercontent.com/cgens67/mcpackgenerator/main/fonts/%E7%B2%BE%E5%93%81.ttf') format("truetype")}
@font-face{font-display:block;font-family:Minecraftia;src:url('https://raw.githubusercontent.com/cgens67/mcpackgenerator/main/fonts/Mojangles.ttf') format("truetype")}
@font-face{font-display:block;font-family:"RFB Store set Loud";src:url('https://raw.githubusercontent.com/cgens67/mcpackgenerator/main/fonts/MinecraftTen.ttf') format("truetype")}

:root{--clr-lightGray:#acacac;--clr-darkGray:#242425;--clr-input:#484d4ace}
*{line-height:calc(1em + .5rem);scrollbar-color:#2f2f2f #272727;scrollbar-width:thin}
html{scroll-behavior:smooth}
::selection{background-color:#00ffba;color:#000}
::-moz-selection{background-color:#00ffba;color:#000}

.input-wrap input,.pack-type__input,textarea, select{border-top:4px solid var(--clr-darkGray);caret-color:#6cc349;height:40px;outline:3px solid #1e1e1f;border-left:none;border-right:none;border-bottom:none;}
.button-container{align-items:flex-end;display:flex;height:60px;justify-content:center;width:100%}
.button-container:last-child{margin:20px 0}
.button-container .mc-button{align-items:center;cursor:pointer;display:flex;flex-direction:column-reverse;height:60px;justify-content:flex-end;outline:3px solid #1e1e1f;width:100%}
.button-container .mc-button:active{height:54px}
.button-container .mc-button .mc-btn-con{align-items:center;display:flex;height:calc(100% - 6px);justify-content:center;width:100%}
.button-container .mc-button .mc-btn-con:active{height:100%}

.mc-btn-wh{background-color:#58585a}
.mc-btn-wh .mc-btn-con{background-color:#d0d1d4;border:3px solid #eff0f0}
.mc-btn-wh:active .mc-btn-con,.mc-btn-wh:hover .mc-btn-con{background-color:#b1b2b5}
.mc-btn-wh .mc-btn-con p{--tw-text-opacity:1;color:rgb(0 0 0/var(--tw-text-opacity))}

.mc-btn-gr{background-color:#1d4d13}
.mc-btn-gr .mc-btn-con{background-color:#3c8527;border:3px solid #4f913c}
.mc-btn-gr:hover .mc-btn-con{background-color:#2a641c;border:3px solid #699260}
.mc-btn-gr:active .mc-btn-con{background-color:#1d4d13;border:3px solid #608259}
.mc-btn-gr .mc-btn-con p{--tw-text-opacity:1;color:rgb(255 255 255/var(--tw-text-opacity))}

.button-container .mc-button .mc-btn-con p{font-family:"RFB Store set Loud",unifont;font-weight:400; font-size: 1.25rem;}
.input-wrap{display:flex;flex-direction:column;width:100%}
.input-wrap p{font-size:.875rem;line-height:1.25rem;margin-bottom:5px;margin-left:-1px}
.input-wrap input, .input-wrap select{background-color:#313233;color:#fff;font-family:Minecraftia,unifont;font-size:.85rem;line-height:1rem;padding:5px .7rem}
.input-wrap input::placeholder{color:#b1b2b5d2}
textarea{background-color:#313233;color:#fff;margin-bottom:1.7rem;min-height:600px;padding:15px;scrollbar-color:#272727 #313233;width:100%}
textarea,textarea::placeholder{font-family:Minecraftia,unifont;font-size:.75rem;line-height:1rem}

.section-title { font-family: "RFB Store set Loud"; font-size: 1.5rem; border-bottom: 2px solid #444; padding-bottom: 5px; margin-top: 1.5rem; color: #00ffba; }
.card { background-color: #313233; border: 3px solid #1e1e1f; padding: 15px; border-radius: 2px; position: relative; margin-bottom: 10px; }
.delete-btn { position: absolute; right: 10px; top: 10px; background: #ff5555; color: white; border: 2px solid #cc0000; font-family: Minecraftia; padding: 5px 10px; cursor: pointer; }
.delete-btn:hover { background: #ff3333; }
.delete-btn:active { transform: translateY(2px); }
.small-btn { background: #3c8527; color: white; border: 2px solid #4f913c; padding: 5px 10px; cursor: pointer; font-family: Minecraftia; font-size: 0.75rem; }
.small-btn:hover { background: #2a641c; }
select option { background: #313233; color: white; }

/* Minecraft-style Toast Notification */
.mc-toast {
    position: fixed;
    top: 20px;
    right: -350px;
    width: 300px;
    background-color: #212121;
    border: 3px solid #000;
    border-top-color: #555;
    border-left-color: #555;
    color: #fff;
    padding: 12px 15px;
    font-family: Minecraftia, unifont;
    font-size: 0.85rem;
    z-index: 9999;
    transition: right 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 15px;
}
.mc-toast.show {
    right: 20px;
}
.mc-toast-title {
    color: #ffff55; /* Minecraft Yellow */
    margin-bottom: 2px;
}
</style>
</head>
<body>
    <div id="toast" class="mc-toast">
        <div>
            <div class="mc-toast-title">Success!</div>
            <div id="toast-message">Manifest copied to clipboard.</div>
        </div>
    </div>

    <div class="container children-spacing" style="padding-top: 3rem; padding-bottom: 5rem;">
        <h1 style="font-family: 'RFB Store set Loud'; font-size: 3rem; text-align: center; color: white; margin-bottom: 1rem;">mcpack generator</h1>
        
        <!-- Header Configuration -->
        <h2 class="section-title">Header Configuration</h2>
        
        <div class="input-wrap">
            <p>Pack Type</p>
            <select id="packType" onchange="updateManifest()">
                <option value="resources">Resource Pack (resources)</option>
                <option value="data">Behavior Pack (data)</option>
                <option value="skin_pack">Skin Pack (skin_pack)</option>
                <option value="world_template">World Template (world_template)</option>
                <option value="client_data">Client Data (client_data)</option>
            </select>
        </div>

        <div class="input-wrap">
            <p>Pack Name</p>
            <input type="text" id="packName" placeholder="pack.name" oninput="updateManifest()">
        </div>
        <div class="input-wrap">
            <p>Pack Description</p>
            <input type="text" id="packDesc" placeholder="pack.description" oninput="updateManifest()">
        </div>
        <div class="input-wrap">
            <p>Version</p>
            <input type="text" id="packVersion" placeholder="1.0.0" oninput="updateManifest()">
        </div>
        <div class="input-wrap">
            <p>Min Engine Version</p>
            <input type="text" id="minEngine" placeholder="1.26.10" oninput="updateManifest()">
        </div>
        <div class="input-wrap">
            <p>Pack Optimization Version (Optional)</p>
            <input type="text" id="packOpt" placeholder="0.1.0" oninput="updateManifest()">
        </div>

        <!-- Arrays / Metadata -->
        <h2 class="section-title">Metadata & Capabilities</h2>
        <div class="input-wrap">
            <p>Capabilities (Comma separated)</p>
            <input type="text" id="capabilities" placeholder="pbr" oninput="updateManifest()">
        </div>
        <div class="input-wrap">
            <p>Authors (Comma separated)</p>
            <input type="text" id="authors" placeholder="Oreville Studios Ltd" oninput="updateManifest()">
        </div>

        <!-- Subpacks -->
        <h2 class="section-title">Subpacks</h2>
        <div id="subpacksList" class="children-spacing"></div>
        <div class="button-container" style="height: 40px; margin-top: 5px;">
            <button class="mc-button mc-btn-wh" onclick="addSubpack()" style="height: 40px;">
                <div class="mc-btn-con"><p>+ ADD SUBPACK</p></div>
            </button>
        </div>

        <!-- Settings -->
        <h2 class="section-title">Settings</h2>
        <div id="settingsList" class="children-spacing"></div>
        <div class="button-container" style="height: 40px; margin-top: 5px;">
            <button class="mc-button mc-btn-wh" onclick="addSetting()" style="height: 40px;">
                <div class="mc-btn-con"><p>+ ADD SETTING</p></div>
            </button>
        </div>

        <!-- JSON Output -->
        <h2 class="section-title">Output</h2>
        <div class="input-wrap">
            <textarea id="output" readonly spellcheck="false"></textarea>
        </div>
        
        <div class="button-container">
            <button class="mc-button mc-btn-gr" onclick="copyJSON()">
                <div class="mc-btn-con"><p>COPY</p></div>
            </button>
        </div>
    </div>

    <script>
        // --- UI Sounds Setup ---
        const sfx = {
            click: new Audio('https://raw.githubusercontent.com/cgens67/mcpackgenerator/main/audios/ui/Click_stereo.ogg%20(1).ogg'),
            release: new Audio('https://raw.githubusercontent.com/cgens67/mcpackgenerator/main/audios/ui/Release.ogg.ogg'),
            toast: new Audio('https://raw.githubusercontent.com/cgens67/mcpackgenerator/main/audios/ui/Toast.ogg')
        };

        function playSfx(type) {
            if (sfx[type]) {
                const clone = sfx[type].cloneNode();
                clone.volume = 0.5;
                clone.play().catch(e => {}); 
            }
        }

        // Use pointer events to avoid mobile touch/mouse double firing
        document.addEventListener('pointerdown', (e) => {
            if (e.target.closest('button, .mc-button, select, .small-btn, .delete-btn')) {
                playSfx('click');
            }
        });

        document.addEventListener('pointerup', (e) => {
            if (e.target.closest('button, .mc-button, select, .small-btn, .delete-btn')) {
                playSfx('release');
            }
        });

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = message;
            toast.classList.add('show');
            playSfx('toast');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // --- Manifest Logic ---
        function uuidv4() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        const state = {
            subpacks: [],
            settings: []
        };

        function renderSubpacks() {
            const container = document.getElementById('subpacksList');
            container.innerHTML = state.subpacks.map((sp, i) => `
                <div class="card">
                    <h3 style="font-family: Minecraftia; margin-bottom: 10px; color: #fff;">Subpack ${i + 1}</h3>
                    <button class="delete-btn" onclick="removeSubpack(${i})">X</button>
                    
                    <div class="input-wrap" style="margin-bottom: 10px;">
                        <p>Folder Name</p>
                        <input type="text" placeholder="e.g. SP0" value="${sp.folder_name}" oninput="state.subpacks[${i}].folder_name=this.value; updateManifest()">
                    </div>
                    <div class="input-wrap" style="margin-bottom: 10px;">
                        <p>Name & Description (Supports § color codes)</p>
                        <input type="text" placeholder="e.g. Custom Experience §8..." value="${sp.name}" oninput="state.subpacks[${i}].name=this.value; updateManifest()">
                    </div>
                    <div class="input-wrap">
                        <p>Memory Performance Tier</p>
                        <input type="number" placeholder="0" value="${sp.memory_performance_tier}" oninput="state.subpacks[${i}].memory_performance_tier=parseInt(this.value)||0; updateManifest()">
                    </div>
                </div>
            `).join('');
        }

        function addSubpack() {
            state.subpacks.push({ folder_name: "", name: "", memory_performance_tier: 0 });
            renderSubpacks();
            updateManifest();
        }

        function removeSubpack(index) {
            state.subpacks.splice(index, 1);
            renderSubpacks();
            updateManifest();
        }

        function renderSettings() {
            const container = document.getElementById('settingsList');
            container.innerHTML = state.settings.map((set, i) => `
                <div class="card">
                    <h3 style="font-family: Minecraftia; margin-bottom: 10px; color: #fff;">Setting ${i + 1}</h3>
                    <button class="delete-btn" onclick="removeSetting(${i})">X</button>
                    
                    <div class="input-wrap" style="margin-bottom: 10px;">
                        <p>Setting Type</p>
                        <select onchange="changeSettingType(${i}, this.value)">
                            <option value="dropdown" ${set.type === 'dropdown' ? 'selected' : ''}>Dropdown</option>
                            <option value="toggle" ${set.type === 'toggle' ? 'selected' : ''}>Toggle</option>
                        </select>
                    </div>
                    <div class="input-wrap" style="margin-bottom: 10px;">
                        <p>Name (ID)</p>
                        <input type="text" placeholder="e.g. namespace:id" value="${set.name}" oninput="state.settings[${i}].name=this.value; updateManifest()">
                    </div>
                    <div class="input-wrap" style="margin-bottom: 10px;">
                        <p>Text (Language Key)</p>
                        <input type="text" placeholder="e.g. text.namespace.id" value="${set.text}" oninput="state.settings[${i}].text=this.value; updateManifest()">
                    </div>
                    
                    <div class="input-wrap" style="margin-bottom: 10px;">
                        <p>Default Value ${set.type === 'toggle' ? '(true / false)' : ''}</p>
                        <input type="text" placeholder="e.g. true" value="${set.default}" oninput="handleDefaultInput(${i}, this.value)">
                    </div>

                    ${set.type === 'dropdown' ? `
                        <div style="background: #242425; padding: 10px; margin-top: 15px; border-radius: 4px;">
                            <p style="font-family: Minecraftia; font-size: 0.8rem; margin-bottom: 10px; color: #00ffba;">Options for Dropdown:</p>
                            ${set.options.map((opt, optIdx) => `
                                <div style="display: flex; gap: 10px; margin-bottom: 8px;">
                                    <div class="input-wrap" style="flex: 1;"><input type="text" placeholder="Name" value="${opt.name}" oninput="state.settings[${i}].options[${optIdx}].name=this.value; updateManifest()"></div>
                                    <div class="input-wrap" style="flex: 1;"><input type="text" placeholder="Text (Lang Key)" value="${opt.text}" oninput="state.settings[${i}].options[${optIdx}].text=this.value; updateManifest()"></div>
                                    <button class="delete-btn" style="position: relative; right: 0; top: 0;" onclick="removeOption(${i}, ${optIdx})">X</button>
                                </div>
                            `).join('')}
                            <button class="small-btn" onclick="addOption(${i})">+ Add Option</button>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        function changeSettingType(index, newType) {
            state.settings[index].type = newType;
            if (newType === 'toggle') {
                delete state.settings[index].options;
                state.settings[index].default = true;
            } else {
                state.settings[index].options = [];
                state.settings[index].default = "";
            }
            renderSettings();
            updateManifest();
        }

        function handleDefaultInput(index, val) {
            if (val.trim().toLowerCase() === "true") state.settings[index].default = true;
            else if (val.trim().toLowerCase() === "false") state.settings[index].default = false;
            else state.settings[index].default = val;
            updateManifest();
        }

        function addSetting() {
            state.settings.push({ type: "toggle", text: "", name: "", default: true });
            renderSettings();
            updateManifest();
        }

        function removeSetting(index) {
            state.settings.splice(index, 1);
            renderSettings();
            updateManifest();
        }

        function addOption(settingIndex) {
            state.settings[settingIndex].options.push({ name: "", text: "" });
            renderSettings();
            updateManifest();
        }

        function removeOption(settingIndex, optionIndex) {
            state.settings[settingIndex].options.splice(optionIndex, 1);
            renderSettings();
            updateManifest();
        }

        function updateManifest() {
            const packType = document.getElementById('packType').value;
            const name = document.getElementById('packName').value || "";
            const desc = document.getElementById('packDesc').value || "";
            const version = document.getElementById('packVersion').value || "";
            const minEngine = document.getElementById('minEngine').value || "";
            const packOpt = document.getElementById('packOpt').value || "";
            
            const capsVal = document.getElementById('capabilities').value;
            const capsList = capsVal ? capsVal.split(',').map(s => s.trim()).filter(s => s) : [];
            
            const authVal = document.getElementById('authors').value;
            const authorsList = authVal ? authVal.split(',').map(s => s.trim()).filter(s => s) : [];

            // Automatically regenerate UUIDs on every update
            const freshHeaderUuid = uuidv4();
            const freshModuleUuid = uuidv4();

            const manifest = {
                format_version: 3,
                header: {
                    description: desc,
                    name: name,
                    uuid: freshHeaderUuid,
                    version: version,
                    min_engine_version: minEngine,
                },
                modules: [
                    {
                        description: desc,
                        type: packType,
                        uuid: freshModuleUuid,
                        version: version
                    }
                ]
            };

            if (packOpt) manifest.header.pack_optimization_version = packOpt;
            if (capsList.length > 0) manifest.capabilities = capsList;
            if (authorsList.length > 0) manifest.metadata = { authors: authorsList };
            if (state.subpacks.length > 0) manifest.subpacks = state.subpacks;
            if (state.settings.length > 0) manifest.settings = state.settings;

            document.getElementById('output').value = JSON.stringify(manifest, null, 4);
        }

        function copyJSON() {
            const textArea = document.getElementById('output');
            textArea.select();
            navigator.clipboard.writeText(textArea.value).then(() => {
                showToast("Manifest copied to clipboard.");
            });
        }

        window.onload = () => {
            renderSubpacks();
            renderSettings();
            updateManifest();
        };
    </script>
</body>
</html>
